[project]
name = "media-transcription-service"
version = "0.1.0"
description = "Upload audio/video and receive a timestamped transcription (FastAPI + Redis + faster-whisper)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "fakeredis[lua]>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PTH", "S"]
ignore = [
    "S101",    # asserts only narrow types in exception handlers
    "N818",    # JobFailure is a deliberate name for the worker-side failure hierarchy
    "ASYNC109",  # explicit timeout parameters are clearer here than asyncio.timeout() wrappers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "ASYNC110"]  # tests poll Redis state on purpose

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["transcriber"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: end-to-end tests against a running Docker Compose stack (deselected by default)"]
addopts = "-m 'not e2e' --strict-markers"

[tool.coverage.run]
source = ["transcriber"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
