name: transcription

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: media-transcription-service:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      API_PORT: "8000"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    image: media-transcription-service:latest  # same image as the api, different command
    command: ["python", "-m", "transcriber.worker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MODEL_NAME: ${MODEL_NAME:-Systran/faster-whisper-small}
    volumes:
      - uploads:/data/uploads
      - model-cache:/models
    depends_on:
      redis:
        condition: service_healthy
    # On `docker compose stop` the current job may finish; if it doesn't, it is re-queued.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "transcriber.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10m  # the first start downloads the model

volumes:
  uploads:
  model-cache:
  redis-data:
